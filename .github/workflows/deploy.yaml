name: Deploy

on:
  push:
    branches:
      - "master" # change to the branch you wish to deploy from

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - id: build-publish
      uses: bitovi/github-actions-react-to-github-pages@v1.2.3
      env:
        VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      with:
        path: dist # change to your build folder
